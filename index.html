<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8202b">
<title>有求不應｜幸運抽籤</title>
<style>
/* ==========================================================
   等比縮放核心
   設計稿：420 (寬) × 900 (高)
   --u 同時受 寬度 與 高度 限制，取最小 → 全版面（含籤筒）一齊縮放
   ========================================================== */
:root{
  --dw: 420;    /* 設計稿寬 */
  --dh: 900;    /* 設計稿高 */
  --uw: calc((min(100vw, 480px) - 16px) / var(--dw));
  --uh: calc((100dvh - 16px) / var(--dh));
  --u : min(var(--uw), var(--uh));   /* ← 全站唯一縮放單位 */
}
@supports not (height: 100dvh){
  :root{ --uh: calc((100vh - 16px) / var(--dh)); }
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{width:100%;max-width:100%;overflow-x:hidden;}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  background:radial-gradient(circle at 50% 0%,#e8434a 0%,#c8202b 45%,#9c0f18 100%);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(14*var(--u) + env(safe-area-inset-top)) 8px calc(20*var(--u) + env(safe-area-inset-bottom));
  position:relative;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:
    repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 22px),
    repeating-linear-gradient(-45deg,#fff 0 2px,transparent 2px 22px);
}

/* ===== 頂部吊籤 ===== */
.hangers{position:absolute;top:0;left:0;right:0;height:calc(130*var(--u));pointer-events:none;z-index:1;}
.hang{position:absolute;top:0;text-align:center;animation:sway 3.5s ease-in-out infinite;transform-origin:top center;}
.hang .rope{width:calc(2*var(--u));min-width:1px;height:calc(var(--h)*var(--u));background:#ffd98a;margin:0 auto;}
.hang .tag{
  background:linear-gradient(180deg,#ffc76b,#f0993a);
  border:calc(2*var(--u)) solid #b85f14;border-radius:calc(7*var(--u));
  padding:calc(9*var(--u)) calc(4*var(--u));color:#8a2b06;font-weight:900;
  writing-mode:vertical-rl;letter-spacing:calc(2*var(--u));font-size:calc(13*var(--u));
  box-shadow:0 calc(4*var(--u)) calc(10*var(--u)) rgba(0,0,0,.3);
}
.hang:nth-child(1){left:3%;--h:42;animation-delay:0s}
.hang:nth-child(2){left:14%;--h:68;animation-delay:.4s}
.hang:nth-child(3){right:14%;--h:68;animation-delay:.8s}
.hang:nth-child(4){right:3%;--h:42;animation-delay:1.2s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ===== 標題 ===== */
.header{text-align:center;z-index:2;width:100%;}
.sub-top{
  display:inline-block;background:#2b0a0a;color:#ffd35c;font-weight:800;
  padding:calc(6*var(--u)) calc(18*var(--u));border-radius:999px;
  font-size:calc(15*var(--u));letter-spacing:calc(1.5*var(--u));
  border:1px solid #ffb545;white-space:nowrap;
}
h1{
  font-size:calc(44*var(--u));margin:calc(13*var(--u)) 0 calc(4*var(--u));
  letter-spacing:calc(2*var(--u));color:#fff;font-weight:900;line-height:1.22;
  text-shadow:0 calc(3*var(--u)) 0 #a0121b,0 calc(7*var(--u)) calc(14*var(--u)) rgba(0,0,0,.5);
  white-space:nowrap;
}
h1 .split{color:#ffd35c;}
.slogan{font-size:calc(17*var(--u));color:#ffe6a7;font-weight:700;margin-top:calc(7*var(--u));white-space:nowrap;}
.note{font-size:calc(13*var(--u));color:#ffc9c9;margin-top:calc(6*var(--u));white-space:nowrap;}
.limit{
  margin-top:calc(12*var(--u));display:inline-block;background:#ffd35c;color:#9c0f18;
  font-weight:900;padding:calc(9*var(--u)) calc(22*var(--u));border-radius:999px;
  font-size:calc(17*var(--u));box-shadow:0 calc(4*var(--u)) 0 #c99a20;
  animation:beat 1.4s ease-in-out infinite;white-space:nowrap;
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ===== 舞台：籤 + 籤筒，全部 --u 等比 ===== */
.stage{
  position:relative;z-index:2;
  width:calc(420*var(--u));
  height:calc(430*var(--u));
  margin-top:calc(18*var(--u));
  flex:none;
}
.sticks{
  position:absolute;left:50%;bottom:calc(150*var(--u));
  transform:translateX(-50%);width:100%;height:calc(280*var(--u));
}
.stick{
  position:absolute;bottom:0;left:50%;
  width:calc(44*var(--u));height:calc(250*var(--u));
  margin-left:calc(-22*var(--u));cursor:pointer;transform-origin:bottom center;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .2s;
}
.stick .body{
  width:100%;height:100%;
  background:linear-gradient(90deg,#e8cfa0,#fdf1d8 35%,#f3dfb6 70%,#d8b985);
  border:calc(2*var(--u)) solid #b9945c;
  border-radius:calc(6*var(--u)) calc(6*var(--u)) calc(4*var(--u)) calc(4*var(--u));
  box-shadow:0 calc(3*var(--u)) calc(8*var(--u)) rgba(0,0,0,.35);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:calc(34*var(--u));position:relative;
}
.stick .body::before{
  content:"";position:absolute;top:calc(-14*var(--u));
  left:calc(-2*var(--u));right:calc(-2*var(--u));height:calc(16*var(--u));
  background:linear-gradient(90deg,#e8cfa0,#fdf1d8 50%,#d8b985);
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.stick .seal{
  position:absolute;top:calc(6*var(--u));left:50%;transform:translateX(-50%);
  width:calc(20*var(--u));height:calc(20*var(--u));
  border:calc(2*var(--u)) solid #c0392b;border-radius:50%;
  color:#c0392b;font-size:calc(11*var(--u));font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.stick .txt{
  writing-mode:vertical-rl;font-size:calc(15*var(--u));font-weight:900;
  color:#8a4b12;letter-spacing:calc(3*var(--u));white-space:nowrap;
}
.stick.up{z-index:99!important;}
@media (hover:hover){.stick:hover{filter:brightness(1.12);}}

/* ---- 籤筒（完全等比） ---- */
.bucket{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:calc(250*var(--u));height:calc(220*var(--u));z-index:5;
}
.bucket .lip{
  height:calc(34*var(--u));
  background:linear-gradient(180deg,#ffd970,#e0a52c);
  border:calc(3*var(--u)) solid #8a5a12;
  border-radius:calc(8*var(--u)) calc(8*var(--u)) 0 0;
  box-shadow:0 calc(3*var(--u)) calc(8*var(--u)) rgba(0,0,0,.3);
}
.bucket .cup{
  height:calc(186*var(--u));margin:0 calc(14*var(--u));
  background:linear-gradient(180deg,#7d3b1c,#5a2612);
  border:calc(3*var(--u)) solid #3e1a0b;border-top:0;
  clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(7*var(--u));
  box-shadow:inset 0 calc(8*var(--u)) calc(20*var(--u)) rgba(0,0,0,.4);
}
.bucket .cup .t1{
  font-size:calc(14*var(--u));color:#ffd35c;font-weight:800;
  letter-spacing:calc(2*var(--u));white-space:nowrap;
}
.bucket .cup .t2{
  font-size:calc(27*var(--u));font-weight:900;white-space:nowrap;
  text-shadow:0 calc(3*var(--u)) 0 rgba(0,0,0,.4);
}
.shake-btn{
  margin-top:calc(3*var(--u));background:#ffd35c;color:#9c0f18;border:none;
  border-radius:999px;padding:calc(11*var(--u)) calc(24*var(--u));
  font-size:calc(16*var(--u));font-weight:900;cursor:pointer;
  box-shadow:0 calc(4*var(--u)) 0 #b8891b;font-family:inherit;
  white-space:nowrap;touch-action:manipulation;
}
.shake-btn:active{transform:translateY(calc(3*var(--u)));box-shadow:0 1px 0 #b8891b;}
.shaking{animation:shake .35s linear infinite;}
@keyframes shake{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}

.tip{
  font-size:calc(13.5*var(--u));color:#ffe0a3;z-index:2;text-align:center;
  line-height:1.85;margin-top:calc(12*var(--u));
}
.counter{color:#ffd35c;font-weight:900;font-size:calc(16*var(--u));}

/* ===== 彈窗 ===== */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:center;justify-content:center;z-index:999;
  padding:calc(20*var(--u)) calc(16*var(--u));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto;
}
.mask.show{display:flex;animation:fade .25s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:calc(360*var(--u));margin:auto;
  background:linear-gradient(180deg,#fff6e2,#ffe3b8);
  border:calc(4*var(--u)) solid #ffd35c;border-radius:calc(22*var(--u));
  padding:calc(26*var(--u)) calc(20*var(--u));text-align:center;color:#8a2b06;
  box-shadow:0 calc(16*var(--u)) calc(44*var(--u)) rgba(0,0,0,.5);
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:calc(26*var(--u));margin-bottom:calc(5*var(--u));}
.modal .g1{font-size:calc(14.5*var(--u));color:#b3541e;font-weight:700;}
.modal .emoji{font-size:calc(58*var(--u));margin:calc(12*var(--u)) 0;display:block;line-height:1;}
.modal .lucky{
  display:inline-block;background:#c0392b;color:#ffd35c;font-weight:900;
  padding:calc(6*var(--u)) calc(18*var(--u));border-radius:999px;
  font-size:calc(18*var(--u));margin:calc(4*var(--u)) 0 calc(10*var(--u));
  letter-spacing:calc(2*var(--u));white-space:nowrap;
}
.modal .pname{font-size:calc(21*var(--u));font-weight:900;margin-bottom:calc(8*var(--u));color:#a02414;}
.modal .pdesc{font-size:calc(14.5*var(--u));line-height:1.7;color:#7a4a20;}
.modal button{
  margin-top:calc(18*var(--u));width:100%;padding:calc(15*var(--u));border:none;
  border-radius:999px;background:linear-gradient(180deg,#ff7a45,#e0361c);color:#fff;
  font-size:calc(18*var(--u));font-weight:900;cursor:pointer;
  box-shadow:0 calc(5*var(--u)) 0 #9c0f18;font-family:inherit;touch-action:manipulation;
}
.modal button:active{transform:translateY(calc(4*var(--u)));box-shadow:0 1px 0 #9c0f18;}

/* 橫屏：以高度為主，籤筒同樣自動縮細 */
@media (orientation:landscape) and (max-height:560px){
  .hangers{display:none;}
  .note{display:none;}
}
</style>
</head>
<body>

<div class="hangers">
  <div class="hang"><div class="rope"></div><div class="tag">大吉籤</div></div>
  <div class="hang"><div class="rope"></div><div class="tag">幸運籤</div></div>
  <div class="hang"><div class="rope"></div><div class="tag">幸福籤</div></div>
  <div class="hang"><div class="rope"></div><div class="tag">上上籤</div></div>
</div>

<div class="header">
  <div class="sub-top">你今日抽左味</div>
  <h1>有求不應<span class="split">｜</span>幸運抽籤</h1>
  <div class="slogan">幸運與否，由你話事～（不保證）</div>
  <div class="note">求籤請誠心，唔靈唔好嘈 🙏</div>
  <div class="limit">唔講咁多，立即抽！</div>
</div>

<div class="stage" id="stage">
  <div class="sticks" id="sticks"></div>
  <div class="bucket" id="bucket">
    <div class="lip"></div>
    <div class="cup">
      <div class="t1">不限次數・任抽</div>
      <div class="t2">我要抽籤</div>
      <button class="shake-btn" id="shakeBtn">搖一搖🎋</button>
    </div>
  </div>
</div>

<div class="tip">
  👆 撳任何一支籤，即刻抽出你今日嘅運程<br>
  點抽都得，抽到滿意為止 😆　已抽 <span class="counter" id="cnt">0</span> 次
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h2>🎊 恭喜你！</h2>
    <div class="g1">你得到了 (*≧ω≦)</div>
    <span class="emoji" id="mEmoji">🎁</span>
    <div class="lucky" id="mLucky">【大吉籤】</div>
    <div class="pname" id="mName">獎品名稱</div>
    <div class="pdesc" id="mDesc">獎品描述</div>
    <button id="closeBtn">收啦 (❁´◡`❁)</button>
  </div>
</div>

<script>
const PRIZES=[
 {lucky:"大吉籤",emoji:"⌨️",name:"鍵盤發洩體驗券",desc:"可對鍵盤進行一次合法、合規、適度發洩。"},
 {lucky:"上上籤",emoji:"🛡️",name:"獲得 OT 免死金牌",desc:"今日準時收工，任何人不得阻止。"},
 {lucky:"幸福籤",emoji:"🚽",name:"屎 Break VIP 通行證",desc:"廁所即日起係你的私人休息室。"},
 {lucky:"幸運籤",emoji:"🐟",name:"釣魚專員認證書",desc:"正式認證你今日有權合法釣魚 30 分鐘。"},
 {lucky:"人妻籤",emoji:"👨",name:"車銀優享用權",desc:"正式認證你係車銀優太太 1 秒。"},
 {lucky:"戰士籤",emoji:"⌨️",name:"Keyboard 發洩體驗券",desc:"可對 Keyboard 進行一次合法、合規、適度發洩 dadada。"},
 {lucky:"大好籤",emoji:"🧿",name:"「我聽日先做」護身符",desc:"今日所有 Deadline 自動順延 24 小時。"},
 {lucky:"走佬籤",emoji:"🏃",name:"馬上收工券",desc:"而家即刻離開公司。"}
];

/* 所有位移都寫成 calc(n * var(--u))：籤 / 籤筒 / 動畫全程同步縮放 */
const N=9, GAP=32, sticks=document.getElementById('sticks'), base=[];
for(let i=0;i<N;i++){
  const rot=(i-(N-1)/2)*7, xn=(i-(N-1)/2)*GAP;
  const t=`translateX(calc(${xn} * var(--u))) rotate(${rot}deg)`;
  base.push({t,xn,rot});
  const el=document.createElement('div');
  el.className='stick'; el.dataset.i=i;
  el.style.transform=t;
  el.style.zIndex=10-Math.abs(i-(N-1)/2);
  el.innerHTML='<div class="body"><div class="seal">籤</div><div class="txt">幸運の種子</div></div>';
  el.addEventListener('mouseenter',()=>{if(!busy&&!isTouch&&!el.classList.contains('up'))
    el.style.transform=`translateX(calc(${xn} * var(--u))) translateY(calc(-26 * var(--u))) rotate(${rot}deg)`;});
  el.addEventListener('mouseleave',()=>{if(!busy&&!isTouch&&!el.classList.contains('up')) el.style.transform=t;});
  el.addEventListener('pointerup',e=>{e.preventDefault();draw(el);});
  sticks.appendChild(el);
}

const isTouch=matchMedia('(hover:none)').matches;
let busy=false,count=0,curEl=null;

function draw(el){
  if(busy) return;
  busy=true; curEl=el;
  const b=base[+el.dataset.i];
  const p=PRIZES[Math.floor(Math.random()*PRIZES.length)];
  el.querySelector('.txt').textContent=p.lucky;
  el.classList.add('up');
  el.style.transition='transform .6s cubic-bezier(.34,1.56,.64,1)';
  el.style.transform=`translateX(calc(${(b.xn*0.3).toFixed(1)} * var(--u))) translateY(calc(-195 * var(--u))) rotate(0deg) scale(1.15)`;
  if(navigator.vibrate) navigator.vibrate(30);
  setTimeout(()=>{
    mEmoji.textContent=p.emoji;
    mLucky.textContent='【'+p.lucky+'】';
    mName.textContent=p.name;
    mDesc.textContent=p.desc;
    mask.classList.add('show');
    document.body.style.overflow='hidden';
  },660);
}

closeBtn.addEventListener('pointerup',e=>{
  e.preventDefault();
  mask.classList.remove('show');
  document.body.style.overflow='';
  count++; cnt.textContent=count;
  if(curEl){
    curEl.style.transform=base[+curEl.dataset.i].t;
    curEl.querySelector('.txt').textContent='求籤問前程';
    setTimeout(()=>curEl.classList.remove('up'),450);
  }
  setTimeout(()=>{busy=false;},450);
});

shakeBtn.addEventListener('pointerup',e=>{
  e.preventDefault();e.stopPropagation();
  if(busy) return;
  busy=true;
  bucket.classList.add('shaking');
  if(navigator.vibrate) navigator.vibrate([25,60,25,60,25]);
  setTimeout(()=>{
    bucket.classList.remove('shaking');
    busy=false;
    const list=[...document.querySelectorAll('.stick')];
    draw(list[Math.floor(Math.random()*list.length)]);
  },900);
});

let lt=0;
document.addEventListener('touchend',e=>{
  const n=Date.now(); if(n-lt<=300) e.preventDefault(); lt=n;
},{passive:false});
</script>
</body>
</html>
